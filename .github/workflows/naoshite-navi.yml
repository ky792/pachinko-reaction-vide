name: naoshite-navi (typecheck + test + build + e2e)

# naoshite-navi/ だけを対象にした独立ワークフロー。既存の動画制作ワークフローとは無関係。
# 外部サービス・シークレットは使わない。デプロイも行わない。
on:
  pull_request:
    paths:
      - "naoshite-navi/**"
      - ".github/workflows/naoshite-navi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: naoshite-navi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: naoshite-navi/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: E2E smoke (phone width)
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          npx next start -p 3000 &
          npx --yes wait-on@8 http://localhost:3000 --timeout 60000
          BASE_URL=http://localhost:3000 SHOTS=e2e-shots npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naoshite-navi-screens
          path: naoshite-navi/e2e-shots/
          retention-days: 7
