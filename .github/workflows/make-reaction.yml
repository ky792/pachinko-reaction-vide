name: Make reaction video (telop format)

# 下部中央テロップ型の反応集（episodes/<回>/reaction.json）を
# 読み上げ（edge-tts）付きで書き出す。
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "回のフォルダ名（episodes/ の下）"
        type: string
        default: "ep003"
      save_to_repo:
        description: "完成動画を outputs-<回> ブランチにも保存する"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EP: ${{ inputs.episode }}
      VOICEVOX_URL: http://127.0.0.1:50021
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and Japanese fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Python packages
        run: pip install edge-tts numpy pillow scipy

      - name: Restore TTS cache
        uses: actions/cache@v4
        with:
          path: cache/tts_reaction
          key: ttsr-${{ inputs.episode }}-${{ hashFiles(format('episodes/{0}/reaction.json', inputs.episode)) }}
          restore-keys: |
            ttsr-${{ inputs.episode }}-
            ttsr-

      - name: Wait for VOICEVOX
        run: |
          for i in $(seq 1 60); do curl -sf "$VOICEVOX_URL/version" && break; sleep 3; done
          curl -sf "$VOICEVOX_URL/version" || { echo "::error::VOICEVOX が起動しませんでした"; exit 1; }
          mkdir -p output && curl -sf "$VOICEVOX_URL/speakers" | python -c "import json,sys;print('\n'.join(sp['name']+': '+', '.join(f\"{st['name']}={st['id']}\" for st in sp['styles']) for sp in json.load(sys.stdin)))" > output/voicevox_speakers.txt

      - name: Restore AivisSpeech models cache
        uses: actions/cache@v4
        with:
          path: ~/aivis
          key: aivis-${{ hashFiles(format('episodes/{0}/reaction.json', inputs.episode)) }}
          restore-keys: aivis-

      - name: Start AivisSpeech (only if the episode uses it)
        run: |
          UUIDS=$(python -c "import json;d=json.load(open('episodes/$EP/reaction.json'));print(' '.join(d.get('aivis_models',[])))")
          if [ -z "$UUIDS" ]; then echo "AivisSpeech は使わない回"; exit 0; fi
          mkdir -p ~/aivis/Models output
          for u in $UUIDS; do
            f=~/aivis/Models/$u.aivmx
            if [ ! -s "$f" ]; then curl -fL --retry 3 -o "$f" "https://api.aivis-project.com/v1/aivm-models/$u/download?model_type=AIVMX"; fi
            ls -la "$f"
          done
          sudo chmod -R 777 ~/aivis
          docker run -d --name aivis -p 10101:10101 -v ~/aivis:/home/user/.local/share/AivisSpeech-Engine-Dev ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          for i in $(seq 1 150); do curl -sf http://127.0.0.1:10101/version && break; sleep 4; done
          curl -sf http://127.0.0.1:10101/version || { docker logs aivis | tail -50; echo "::error::AivisSpeech が起動しませんでした"; exit 1; }
          curl -sf http://127.0.0.1:10101/speakers | python -c "import json,sys;print('\n'.join(sp['name']+': '+', '.join(st['name'] for st in sp['styles']) for sp in json.load(sys.stdin)))" > output/aivis_speakers.txt
          cat output/aivis_speakers.txt

      - name: Render
        run: |
          test -f "episodes/$EP/reaction.json" || { echo "::error::episodes/$EP/reaction.json がありません"; exit 1; }
          python reaction/make_video.py "episodes/$EP/reaction.json" -o "output/${EP}.mp4"
          cp work/reaction/timeline.json "output/${EP}_timeline.json"
          cat "output/${EP}_credits.txt" || true

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.episode }}-reaction
          path: |
            output/${{ inputs.episode }}.mp4
            output/${{ inputs.episode }}_timeline.json
          retention-days: 7

      - name: Save result to outputs branch
        if: ${{ inputs.save_to_repo }}
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/outbranch && cp output/${EP}.mp4 output/${EP}_timeline.json /tmp/outbranch/ && cp output/${EP}_credits.txt output/voicevox_speakers.txt output/aivis_speakers.txt /tmp/outbranch/ 2>/dev/null || true
          cd /tmp/outbranch
          git init -q -b "outputs-${EP}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "完成動画: ${EP}.mp4 (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" "outputs-${EP}"
