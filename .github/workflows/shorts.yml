name: Shorts (30秒ナギバク研究所)

# shorts/render.json を書き換えて push すると動く（横型の remotion/ とは別フォルダ・別ワークフロー）
#   {"episode": "s001", "stills": [フレーム, …], "full": true|false}
# stills → outputs-shorts-<回> ブランチに確認用の静止画（full=true なら 720p プレビューも）
# full=true → 1080×1920 の完成版を release shorts-<回> に置く
on:
  push:
    paths:
      - shorts/render.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: shorts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-core ffmpeg
      - name: Install Remotion
        run: npm install --no-audit --no-fund
      - name: Read request
        run: |
          echo "EP=$(python3 -c "import json;print(json.load(open('render.json'))['episode'])")" >> $GITHUB_ENV
          echo "FULL=$(python3 -c "import json;print('1' if json.load(open('render.json')).get('full') else '')")" >> $GITHUB_ENV
          echo "STILLS=$(python3 -c "import json;print(' '.join(map(str,json.load(open('render.json')).get('stills',[]))))")" >> $GITHUB_ENV
      - name: Stills
        run: |
          mkdir -p out/pub
          for f in $STILLS; do npx remotion still "Shorts-$EP" "out/pub/frame_$(printf %04d $f).jpg" --frame=$f --scale=0.5 --image-format=jpeg; done
      - name: Render MP4
        if: env.FULL == '1'
        run: |
          npx remotion render "Shorts-$EP" out/raw.mp4 --codec=h264 --crf=18 --concurrency=4
          # 音量を YouTube の基準（-14 LUFS）にそろえる（映像はそのまま）
          ffmpeg -v error -y -i out/raw.mp4 -c:v copy -af loudnorm=I=-14:TP=-1.5:LRA=11,aresample=48000 -c:a aac -b:a 192k -movflags +faststart out/$EP.mp4
          ffprobe -v error -show_entries format=duration:stream=width,height,codec_name -of compact out/$EP.mp4
          ffmpeg -v error -y -i out/$EP.mp4 -vf scale=720:-2 -c:v libx264 -preset veryfast -crf 26 -c:a aac -b:a 128k out/pub/${EP}_preview.mp4
          ffmpeg -v error -y -i out/$EP.mp4 -vn -ac 1 -ar 16000 out/pub/${EP}_audio16k.wav
      - name: Publish full video as a release
        if: env.FULL == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete shorts-$EP -y --cleanup-tag || true
          gh release create shorts-$EP out/$EP.mp4 --target "$GITHUB_SHA" --prerelease \
            --title "30秒ナギバク研究所 $EP（Shorts 1080×1920）" --notes "feat/shorts-lab で自動書き出し"
      - name: Save to outputs branch
        run: |
          cd out/pub
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b outputs-shorts-$EP
          git add -A
          git commit -q -m "Shorts $EP ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" outputs-shorts-$EP
