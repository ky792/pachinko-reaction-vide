name: news03 fix audio (limiter only)

# Release news03-youtopya の mp4 に、音割れ防止のリミッターだけをかけ直す（映像はそのまま・再書き出しなし）
on:
  push:
    branches: [feat/news03-youtopya]
    paths:
      - ".github/workflows/news03-fix-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Limit and re-upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download news03-youtopya --repo "$GITHUB_REPOSITORY" --pattern news03_youtopya.mp4 --dir in
          mkdir -p out
          ffmpeg -v error -y -i in/news03_youtopya.mp4 -c:v copy -af "alimiter=limit=0.84:attack=0.5:release=50:level=false:asc=1" -c:a aac -b:a 192k out/news03_youtopya.mp4
          ffmpeg -hide_banner -i out/news03_youtopya.mp4 -af ebur128=peak=true -f null - 2>&1 | tail -12
          gh release upload news03-youtopya out/news03_youtopya.mp4 --clobber --repo "$GITHUB_REPOSITORY"
          ffmpeg -v error -y -i out/news03_youtopya.mp4 -vf scale=1280:-2 -c:v libx264 -preset veryfast -crf 27 -c:a aac -b:a 128k preview.mp4
          mkdir -p p && mv preview.mp4 p/news03_preview.mp4 && cd p
          git init -q && git config user.name "github-actions[bot]" && git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b outputs-news03 && git add -A && git commit -q -m "Preview (limiter fixed) ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" outputs-news03
