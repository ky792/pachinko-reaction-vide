name: Add voice (edge-tts)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = 冒頭だけ / full = フル"
        type: choice
        options: [test, full]
        default: test
      test_seconds:
        description: "テストで書き出す秒数"
        type: string
        default: "90"
      style:
        description: "directed = 手動ディレクション（冒頭90秒） / dynamic = 自動の緩急 / flat = 一定の読み方"
        type: choice
        options: [directed, dynamic, flat]
        default: directed
      save_to_repo:
        description: "完成動画を outputs ブランチにも保存する"
        type: boolean
        default: true
      video_url:
        description: "動画を input/ に置けない場合のダウンロードURL（空なら input/1000010320.mp4 を使用）"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  add-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install Python packages (edge-tts, numpy)
        run: pip install -r requirements.txt

      - name: Get input video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          if [ -n "$VIDEO_URL" ]; then
            echo "Downloading video from URL"
            curl -L --fail -o input/1000010320.mp4 "$VIDEO_URL"
          fi
          if [ ! -f input/1000010320.mp4 ]; then
            echo "input/ に無いので、Releases の添付ファイルから探します"
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "1000010320.mp4" --dir input || true
          fi
          if [ ! -f input/1000010320.mp4 ]; then
            echo "::error::1000010320.mp4 が見つかりません。input/ に置く・Releases に添付する・video_url を指定する、のどれかをしてください。"
            exit 1
          fi
          ls -la input/

      - name: Restore TTS cache
        uses: actions/cache@v4
        with:
          path: cache/tts
          key: tts-${{ hashFiles('scripts/timeline.json', 'config.json') }}
          restore-keys: tts-

      - name: Add voice
        id: run
        run: |
          if [ "${{ inputs.mode }}" = "full" ]; then
            python src/add_voice.py --style "${{ inputs.style }}"
          else
            python src/add_voice.py --style "${{ inputs.style }}" --test "${{ inputs.test_seconds }}"
          fi

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: voice-${{ inputs.style }}-${{ inputs.mode }}
          path: |
            ${{ steps.run.outputs.output_path }}
            work/voice_plan.json
          retention-days: 7
          if-no-files-found: error

      - name: Save result to outputs branch
        if: ${{ inputs.save_to_repo }}
        env:
          OUT: ${{ steps.run.outputs.output_path }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/outbranch && cp "$OUT" /tmp/outbranch/
          if [ -f work/voice_plan.json ]; then cp work/voice_plan.json /tmp/outbranch/; fi
          cd /tmp/outbranch
          git init -q -b outputs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "完成動画: $(basename "$OUT") (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" outputs
