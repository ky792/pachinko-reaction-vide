name: Remotion news OP (trial)

on:
  push:
    branches: [feat/remotion-news-op]
    paths:
      - "remotion/**"
      - ".github/workflows/remotion-news-op.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remotion-news-op
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra ffmpeg
      - name: Install Remotion
        run: npm install --no-audit --no-fund
      - name: Render still previews
        run: |
          mkdir -p out
          for f in 40 120 150 230 290 318 350 420; do
            npx remotion still NewsOpening "out/frame_${f}.png" --frame=$f
          done
      - name: Render MP4
        run: |
          npx remotion render NewsOpening out/news_op.mp4 --codec=h264 --crf=18
          ffprobe -v error -show_entries format=duration -of csv=p=0 out/news_op.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-news-op
          path: remotion/out/
          retention-days: 7
      - name: Save to outputs-remotion branch
        run: |
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b outputs-remotion
          git add -A
          git commit -q -m "Render ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" outputs-remotion
