name: Test lab motion engine

on:
  pull_request:
    paths:
      - "lab/**"
      - "episodes/lab_motion_demo/**"
      - "tests/test_lab_motion.py"
      - ".github/workflows/test-lab-motion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          python -m pip install "pillow>=10" "numpy>=1.24" "scipy>=1.10"
      - name: Check Python syntax
        run: python -m compileall -q lab tests/test_lab_motion.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_lab_motion.py' -v
      - name: Render motion demo stills
        run: |
          mkdir -p output
          python lab/render.py episodes/lab_motion_demo/scene.json -o output/lab_motion_demo.png --stills 3,5
          test -s output/lab_motion_demo_03.00.png
          test -s output/lab_motion_demo_05.00.png
      - name: Upload still previews
        uses: actions/upload-artifact@v4
        with:
          name: lab-motion-preview
          path: output/*.png
          retention-days: 3
